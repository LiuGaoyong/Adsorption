[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/LiuGaoyong/Adsorption"
Repository = "https://github.com/LiuGaoyong/Adsorption"
Issues = "https://github.com/LiuGaoyong/Adsorption/issues/"

[project]
name = "adsorption"
version = "0.1.2"
readme = "README.md"
description = "Adsorption Based on ASE."
keywords = ["chemistry", "adsorption"]
authors = [
    { name = "LiuGaoyong", email = "liugaoyong_88@163.com" }, #
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Topic :: Scientific/Engineering :: Chemistry',
    'Intended Audience :: Science/Research',
]
requires-python = ">=3.12, <3.14"
license = "GPL-3.0-or-later"
dependencies = [
    "ase",
    "array-api-compat",
    "array-api-extra",
    "graphatoms>=1.1.5",
    "gymnasium[all]>=1",
    "hydra-core>=1.3",
    "typing-extensions",
    'ray[all]>=2.40',
]
[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.3",
    "pytest-xdist",
    "jupyterlab",
    "nequip; sys_platform != 'win32'",
]

[project.scripts]
adsorption-tune = "adsorption.runner._cli:main"

# uv config
[tool.uv]
package = true
[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple" # TUNA
default = true

# pytest config
[tool.pytest.ini_options]
addopts = '--maxfail=1 -rf' # exit after 1 failures, report fail info
testpaths = ["src/tests"]
filterwarnings = [
    "error", # All other warnings are transformed into errors.
    # ignore the following warnings that matching a regex
    "ignore::DeprecationWarning",
]

# ruff config
[tool.ruff]
line-length = 80
indent-width = 4
select = ["F", "E", "W", "UP", "D"]
ignore = ["F722", 'D100']
[tool.ruff.pydocstyle]
convention = "google"

[tool.pixi.package]

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*" }

[tool.pixi.workspace]
preview = ["pixi-build"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
adsorption = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test = "pytest -s -vv"
test-tune = "adsorption-tune"

[tool.pixi.dependencies]
python = ">=3.12, <3.14"
ray-all = ">=2.40,<3"
gymnasium-all = ">=1.0.0,<2"
ase = ">=3.28.0,<4"
openbabel = ">=3.1.1,<4"
hydra-core = ">=1.3.2,<2"
graphatoms = ">=1.1.5,<2"
pytest = ">=8.3.0,<9"
nequip = ">=0.18.0,<0.19"
pytest-xdist = ">=3.8.0,<4"
geotorch = ">=0.4.0,<0.5"
jupyterlab = ">=4.5.8,<5"
ipywidgets = ">=8.1.8,<9"
array-api-compat = ">=1.15.0,<2"
array-api-extra = ">=0.11.0,<0.12"
sympy = ">=1.14.0,<2"

