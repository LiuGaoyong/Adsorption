# site: cluster_surface_bri; adsorbate: CH3OH
substrate:
  _target_: ase.cluster.Octahedron
  symbol: Cu
  length: 10

adsorbate:
  _target_: ase.build.molecule
  name: CH3OH
  conformers: none

sites: [[608, 610]]

protocol:
  n_oa: 6
  n_rot: 4
  n_d: 3
  d_min: 2.0
  d_max: 3.5
  d_min_radius_scale: 0.1
  d_max_radius_scale: 0.35
  anchor: com
  orientation_kind: auto

filters:
  - _target_: adsorption.filters.GeometryFilter
    scale: 1.0

budget:
  max_candidates: 1000000

start: 1
stop: null
outputs: ./results

parallel:
  backend: loky
  n_jobs: -1

hydra:
  job:
    chdir: false
  run:
    dir: .
