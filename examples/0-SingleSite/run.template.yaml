# Optional NequIP tier: use run.nequip.template.yaml with
# NEQUIP_MODEL set; see README.
# Shared overrides for examples/0-SingleSite.
#
# run_all.sh deep-merges this file into every <site>/<adsorbate>/run.yaml
# before running it. Edit a value here to change all 96 single-site examples
# at once; per-case substrate/sites/adsorbate identity is kept.
adsorbate:
  # Rigid rotamers from the RDKit-detected rotatable bonds. Molecules with no
  # rotatable bond keep a single structure.
  conformers: rotamers
  dihedrals: 6
  max_rotamers: 64

protocol:
  n_oa: 6
  n_rot: 4
  n_d: 3
  d_min: 2.0
  d_max: 3.5
  d_min_radius_scale: 0.1
  d_max_radius_scale: 0.35
  anchor: com
  orientation_kind: auto

filters:
  - _target_: adsorption.filters.GeometryFilter
    scale: 1.0
  - _target_: adsorption.filters.LennardJonesEnergyFilter
    e_cut: null
    max_steps: 10
    fmax: 0.3
    reject_on_unconverged: false

budget:
  max_candidates: 1000000

start: 1
stop: null
outputs: ./results

parallel:
  # Demo cases are small; use N_JOBS=-1 for larger campaigns.
  backend: loky
  n_jobs: 1
  chunk_factor: 4
  threads_per_worker: 1
