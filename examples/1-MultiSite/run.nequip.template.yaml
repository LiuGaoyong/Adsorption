# NequIP variant of run.template.yaml: geometry -> Lennard-Jones single-point
# screen -> NequIP optimization. Duplicate rotamers are dropped at resolution. Use with:
#   NEQUIP_MODEL=/path/model.pth TEMPLATE=run.nequip.template.yaml ./run_all.sh
adsorbate:
  conformers: rotamers
  dihedrals: 10
  max_rotamers: 100
protocol:
  n_oa: 100
  n_rot: 100
  n_d: 20
  d_min: null  # hard-sphere contact distance of each site and adsorbate
  d_max: 3.0
  d_min_radius_scale: 0.0
  d_max_radius_scale: 0.0
  anchor: com
  orientation_kind: auto
filters:
- _target_: adsorption.filters.GeometryFilter
  scale: 1.0
# Cheap steric screen: single-point Lennard-Jones, no optimizer.
- _target_: adsorption.filters.LennardJonesScreenFilter
  e_cut: null
- _target_: adsorption.filters.NequIPOptimizedEnergyFilter
  model_path: ${oc.env:NEQUIP_MODEL,""}
  device: ${oc.env:NEQUIP_DEVICE,cpu}
  chemical_species_to_atom_type_map: true
  neighborlist_backend: matscipy
  e_cut: null
  fmax: 0.05
  max_steps: 50
  fix_substrate: false
  fix_adsorbate_bonds: false
  reject_on_unconverged: false
budget:
  max_candidates: null
start: 1
stop: null
outputs: ./results
parallel:
  backend: loky
  engine: ray
  n_jobs: 6
  chunk_factor: 4
  threads_per_worker: 1
