# system: S1-Cu-octahedron; adsorbate: O
substrate:
  _target_: ase.cluster.Octahedron
  symbol: Cu
  length: 10

adsorbate:
  _target_: ase.build.molecule
  name: O
  conformers: none

sites:
  - [303]
  - [303, 334]
  - [303, 334, 464]
  - [610]
  - [608, 610]
  - [607, 608, 610]

protocol:
  # Reduced demo grid; the paper matrix uses N=N_AB=200, M=12 and
  # site-specific N_OA from pipeline/sites/.
  n_oa: 10
  n_rot: 10
  n_d: 6
  d_min: 0.8
  d_max: 3.0
  d_min_radius_scale: 0.0
  d_max_radius_scale: 0.0
  anchor: com
  orientation_kind: auto

filters:
  - _target_: adsorption.filters.GeometryFilter
    scale: 1.0
  - _target_: adsorption.filters.LennardJonesEnergyFilter
    e_cut: null
    max_steps: 10
    fmax: 0.3
    reject_on_unconverged: false

budget:
  max_candidates: 1000000

start: 1
stop: null
outputs: ./results

parallel:
  backend: loky
  n_jobs: -1

hydra:
  job:
    chdir: false
  run:
    dir: .
