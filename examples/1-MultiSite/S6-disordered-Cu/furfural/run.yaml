# system: S6-disordered-Cu; adsorbate: furfural (O=Cc1ccco1)
substrate:
  _target_: ase.io.read
  filename: ../../structures/S6-disordered-Cu.xyz
  format: extxyz

adsorbate:
  smiles: O=Cc1ccco1
  conformers: auto
  n_conformers: 4
  conformer_seed: 20261030
  prune_rmsd: 0.5

sites:
  - [12]
  - [12, 163]

protocol:
  # Reduced demo grid; the paper matrix uses N=N_AB=200, M=12.
  n_oa: 10
  n_rot: 10
  n_d: 6
  d_min: 0.8
  d_max: 3.0
  d_min_radius_scale: 0.0
  d_max_radius_scale: 0.0
  anchor: com
  orientation_kind: auto

filters:
  - _target_: adsorption.filters.GeometryFilter
    scale: 1.0
  - _target_: adsorption.filters.LennardJonesEnergyFilter
    e_cut: null
    max_steps: 10
    fmax: 0.3
    reject_on_unconverged: false

budget:
  max_candidates: 1000000

start: 1
stop: null
outputs: ./results

parallel:
  backend: loky
  n_jobs: -1

hydra:
  job:
    chdir: false
  run:
    dir: .
