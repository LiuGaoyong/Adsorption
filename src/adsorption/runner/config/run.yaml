defaults:
  - base_config
  - substrate: fcc111
  - adsorbate: co
  - filter: geometry
  - _self_

sites: [[0]]
protocol:
  grid: {n: 200}
  distances: {d_min: 1.2, d_max: 3.0, step: 0.2}
  orientation: {kind: auto, n: 200}
filters:
  - ${filter}
start: 1
stop: null
outputs: "./runs/${now:%Y-%m-%d_%H-%M-%S}"
hydra:
  run:
    dir: ${outputs}
